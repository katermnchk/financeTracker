<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Finance Tracker - Категории</title>
    <link href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h3 class="mb-0"><i class="bi bi-tags"></i> Управление категориями</h3>
                    <a th:href="@{/dashboard}" class="btn btn-outline-light">
                        <i class="bi bi-arrow-left-circle"></i> Назад
                    </a>
                </div>
                <div class="card-body">

                    <h5 class="mb-3">
                        <i class="bi bi-pencil-square"></i>
                        <span th:text="${category.id != null} ? 'Редактировать категорию' : 'Добавить категорию'"></span>
                    </h5>

                    <form th:if="${category.id != null}"
                          th:action="@{/categories/edit/{id}(id=${category.id})}"
                          th:object="${category}" method="post" class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Название</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required/>
                        </div>
                        <div class="col-md-6">
                            <label for="description" class="form-label">Описание</label>
                            <input type="text" class="form-control" id="description" th:field="*{description}"/>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Обновить
                            </button>
                            <a th:href="@{/categories}" class="btn btn-secondary ms-2">
                                <i class="bi bi-x-circle"></i> Отмена
                            </a>
                        </div>
                    </form>

                    <form th:if="${category.id == null}"
                          th:action="@{/categories}"
                          th:object="${category}" method="post" class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Название</label>
                            <input type="text" class="form-control" th:field="*{name}" required/>
                        </div>
                        <div class="col-md-6">
                            <label for="description" class="form-label">Описание</label>
                            <input type="text" class="form-control" th:field="*{description}"/>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-plus-circle"></i> Создать
                            </button>
                            <a th:href="@{/categories}" class="btn btn-secondary ms-2">
                                <i class="bi bi-x-circle"></i> Отмена
                            </a>
                        </div>
                    </form>

                    <h5 class="mb-3" th:if="${categories != null and !categories.isEmpty()}">
                        <i class="bi bi-list-check"></i> Ваши категории
                    </h5>

                    <table class="table table-bordered table-hover align-middle"
                           th:if="${categories != null and !categories.isEmpty()}">
                        <thead class="table-light">
                        <tr>
                            <th>Название</th>
                            <th>Описание</th>
                            <th class="text-center">Действия</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="cat : ${categories}">
                            <td th:text="${cat.name}"></td>
                            <td th:text="${cat.description} ?: 'Нет описания'"></td>
                            <td class="text-center">
                                <a th:href="@{/categories/edit/{id}(id=${cat.id})}" class="btn btn-info btn-sm me-2">
                                    <i class="bi bi-pencil"></i> Редактировать
                                </a>
                                <form th:action="@{/categories/delete/{id}(id=${cat.id})}" method="post"
                                      class="d-inline">
                                    <button type="submit" class="btn btn-danger btn-sm">
                                        <i class="bi bi-trash"></i> Удалить
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>

                    <div th:if="${categories == null or categories.isEmpty()}" class="alert alert-info text-center">
                        <i class="bi bi-exclamation-circle"></i> У вас пока нет категорий.
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

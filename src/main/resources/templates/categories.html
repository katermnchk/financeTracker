<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Finance Tracker - Категории</title>
    <link href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3>Управление категориями</h3>
                </div>
                <div class="card-body">
                    <h4 th:text="${category.id != null} ? 'Редактировать категорию' : 'Добавить категорию'"></h4>

                    <form th:if="${category.id != null}"
                          th:action="@{/categories/edit/{id}(id=${category.id})}"
                          th:object="${category}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">Название</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required/>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Описание</label>
                            <input type="text" class="form-control" id="description" th:field="*{description}"/>
                        </div>
                        <button type="submit" class="btn btn-primary">Обновить</button>
                        <a th:href="@{/categories}" class="btn btn-secondary ms-2">Отмена</a>
                    </form>

                    <form th:if="${category.id == null}"
                          th:action="@{/categories}"
                          th:object="${category}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">Название</label>
                            <input type="text" class="form-control" th:field="*{name}" required/>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Описание</label>
                            <input type="text" class="form-control" th:field="*{description}"/>
                        </div>
                        <button type="submit" class="btn btn-primary">Создать</button>
                        <a th:href="@{/categories}" class="btn btn-secondary ms-2">Отмена</a>
                    </form>

                    <h4 class="mt-4" th:if="${categories != null and !categories.isEmpty()}">Ваши категории</h4>
                    <table class="table table-bordered" th:if="${categories != null and !categories.isEmpty()}">
                        <thead>
                        <tr>
                            <th>Название</th>
                            <th>Описание</th>
                            <th>Действия</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="cat : ${categories}">
                            <td th:text="${cat.name}"></td>
                            <td th:text="${cat.description} ?: 'Нет описания'"></td>
                            <td>
                                <a th:href="@{/categories/edit/{id}(id=${cat.id})}" class="btn btn-info btn-sm">Редактировать</a>
                                <form th:action="@{/categories/delete/{id}(id=${cat.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-danger btn-sm">Удалить</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <div th:if="${categories == null or categories.isEmpty()}" class="alert alert-info">
                        У вас пока нет категорий.
                    </div>
                    <a th:href="@{/dashboard}" class="btn btn-secondary mt-3">Назад</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

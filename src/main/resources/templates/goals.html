<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Finance Tracker - Цели</title>
    <link href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
<div class="container py-5">
    <h2 class="text-primary mb-4">Управление целями</h2>

    <div class="mb-4">
        <a th:href="@{/dashboard}" class="btn btn-outline-primary">
            <i class="bi bi-house"></i> На главную
        </a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-success text-white">
            <i class="bi bi-plus-circle"></i> Добавить новую цель
        </div>
        <div class="card-body">
            <form th:action="@{/goals/add}" method="post" class="row g-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="col-md-3">
                    <label for="categoryId" class="form-label">Категория</label>
                    <select class="form-control" id="categoryId" name="categoryId" required>
                        <option value="" disabled selected>Выберите категорию</option>
                        <option th:each="category : ${categories}"
                                th:if="${category != null}"
                                th:value="${category.id}"
                                th:text="${category.name}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="amount" class="form-label">Сумма (BYN)</label>
                    <input type="number" class="form-control" id="amount" name="amount" step="0.01" min="0.01" required/>
                </div>
                <div class="col-md-3">
                    <label for="month" class="form-label">Месяц</label>
                    <input type="month" class="form-control" id="month" name="month"
                           th:value="${month != null} ? ${#temporals.format(month, 'yyyy-MM')} : ${#temporals.format(#dates.createNow(), 'yyyy-MM')}"
                           required/>
                </div>
                <div class="col-md-3">
                    <label for="type" class="form-label">Тип</label>
                    <select class="form-control" id="type" name="type" required>
                        <option value="INCOME">Доход</option>
                        <option value="EXPENSE">Расход</option>
                    </select>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-circle"></i> Добавить
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-info text-white">
            <i class="bi bi-wallet2"></i> Ваши цели
        </div>
        <div class="card-body">
            <table class="table table-hover table-bordered align-middle">
                <thead class="table-light">
                <tr>
                    <th>Категория</th>
                    <th>Тип</th>
                    <th>Месяц</th>
                    <th>Цель (BYN)</th>
                    <th>Потрачено/Заработано (BYN)</th>
                    <th>Прогресс</th>
                    <th class="text-center">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="goal : ${goals}" th:if="${goal != null and goal.category != null and goal.amount != null and goal.amount > 0}">
                    <td th:text="${goal.category.name} ?: 'Неизвестно'"></td>
                    <td th:text="${goal.type == 'INCOME' ? 'Доход' : 'Расход'}"></td>
                    <td th:text="${goal.month != null} ? ${#temporals.format(goal.month, 'MMMM yyyy')} : 'Не указан'"></td>
                    <td th:text="${goal.amount}"></td>
                    <td>
                        <span th:text="${@goalService.getSpentForGoal(goal) ?: 0}"></span>
                    </td>
                    <td>
                        <div class="progress" style="height: 20px;">
                            <div class="progress-bar"
                                 th:classappend="${@goalService.getSpentForGoal(goal) > goal.amount} ? 'bg-danger' : 'bg-success'"
                                 role="progressbar"
                                 th:style="'width: ' + ${@goalService.getProgressPercentage(goal)} + '%'"
                                 th:aria-valuenow="${@goalService.getProgressPercentage(goal)}"
                                 aria-valuemin="0"
                                 aria-valuemax="100"
                                 th:text="${@goalService.getProgressPercentage(goal)} + '%'">
                            </div>
                        </div>
                    </td>
                    <td class="text-center">
                        <form th:action="@{/goals/delete/{id}(id=${goal.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="bi bi-trash"></i> Удалить
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${goals == null or goals.isEmpty()}">
                    <td colspan="7" class="text-center text-muted">Целей пока нет</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>

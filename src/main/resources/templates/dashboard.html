<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Finance Tracker - Панель управления</title>
    <link href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
<div class="container py-5">
    <div class="mb-4 d-flex justify-content-between align-items-center">
        <h2 class="text-primary mb-0">Панель управления</h2>
        <div>
            <a th:href="@{/profile}" class="btn btn-outline-secondary me-2">
                <i class="bi bi-person-circle"></i> Профиль
            </a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-danger">
                    <i class="bi bi-box-arrow-right"></i> Выйти
                </button>
            </form>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            Добро пожаловать, <span th:text="${username}"></span>!
        </div>
        <div class="card-body">
            <h4 class="mb-3"><i class="bi bi-wallet2"></i> Ваши счета</h4>

            <table class="table table-hover table-bordered align-middle">
                <thead class="table-light">
                <tr>
                    <th>Название</th>
                    <th>Баланс</th>
                    <th class="text-center">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="account : ${accounts}">
                    <td th:text="${account.name}"></td>
                    <td th:text="${account.balance} + ' BYN'"></td>
                    <td class="text-center">
                        <a th:href="@{/transactions/{id}(id=${account.id})}" class="btn btn-sm btn-info me-2">
                            <i class="bi bi-list-ul"></i> Транзакции
                        </a>
                        <form th:action="@{/account/delete/{id}(id=${account.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="bi bi-trash"></i> Удалить
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${accounts.isEmpty()}">
                    <td colspan="3" class="text-center text-muted">Счетов пока нет</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-success text-white">
                    <i class="bi bi-plus-circle"></i> Добавить новый счет
                </div>
                <div class="card-body">
                    <form th:action="@{/account/add}" th:object="${newAccount}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">Название счета</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Например: Карта Беларусбанка" required/>
                        </div>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle"></i> Добавить
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-6 d-flex align-items-stretch">
            <div class="card shadow-sm mb-4 w-100">
                <div class="card-header bg-warning text-dark">
                    <i class="bi bi-tags"></i> Категории
                </div>
                <div class="card-body d-flex flex-column justify-content-center">
                    <p class="mb-3">Управляйте своими категориями расходов и доходов.</p>
                    <a href="/categories" class="btn btn-warning align-self-start">
                        <i class="bi bi-gear"></i> Перейти к категориям
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Finance Tracker - Панель управления</title>
    <link href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h3 class="mb-0">Добро пожаловать, <span th:text="${username}"></span>!</h3>
                    <div>
                        <a th:href="@{/profile}" class="btn btn-outline-light me-2">
                            <i class="bi bi-person-circle"></i> Профиль
                        </a>
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-outline-light">
                                <i class="bi bi-box-arrow-right"></i> Выйти
                            </button>
                        </form>
                    </div>
                </div>

                <div class="card-body">
                    <h4 class="mb-3"><i class="bi bi-wallet2"></i> Ваши счета</h4>

                    <table class="table table-bordered table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Название</th>
                            <th>Баланс</th>
                            <th class="text-center">Действия</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="account : ${accounts}">
                            <td th:text="${account.name}"></td>
                            <td th:text="${account.balance} + ' BYN'"></td>
                            <td class="text-center">
                                <a th:href="@{/transactions/{id}(id=${account.id})}" class="btn btn-info btn-sm me-2">
                                    <i class="bi bi-list-ul"></i> Транзакции
                                </a>
                                <form th:action="@{/account/delete/{id}(id=${account.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-danger btn-sm">
                                        <i class="bi bi-trash"></i> Удалить
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${accounts.isEmpty()}">
                            <td colspan="3" class="text-center text-muted">Счетов нет</td>
                        </tr>
                        </tbody>
                    </table>

                    <hr class="my-4">

                    <h5 class="mb-3"><i class="bi bi-plus-circle"></i> Добавить новый счет</h5>
                    <form th:action="@{/account/add}" th:object="${newAccount}" method="post" class="row g-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Название счета</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Например: Карта Беларусбанка" required/>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Добавить счет
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>
</body>
</html>

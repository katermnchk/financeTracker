<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Finance Tracker - Транзакции</title>
    <link href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10 col-xl-9">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3 th:text="${transaction.id != null} ? 'Редактировать транзакцию' : 'Создать новую транзакцию'"></h3>
                </div>
                <div class="card-body">

                    <!-- Общая форма: редактирование или добавление -->
                    <form th:action="${transaction.id != null} ? @{'/transactions/edit/' + ${transaction.id}} : @{/transactions/add}"
                          th:object="${transaction}" method="post" novalidate>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="accountId" class="form-label">Счёт</label>
                                <select class="form-select" id="accountId" th:field="*{accountId}" required>
                                    <option value="">Выберите счёт</option>
                                    <option th:each="account : ${accounts}"
                                            th:value="${account.id}"
                                            th:text="${account.name}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('accountId')}" th:errors="*{accountId}"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="categoryId" class="form-label">Категория</label>
                                <select class="form-select" id="categoryId" th:field="*{categoryId}" required>
                                    <option value="">Выберите категорию</option>
                                    <option th:each="category : ${availableCategories}"
                                            th:value="${category.id}"
                                            th:text="${category.name}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="amount" class="form-label">Сумма</label>
                                <input type="number" step="0.01" class="form-control" id="amount" th:field="*{amount}" required/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="type" class="form-label">Тип</label>
                                <select class="form-select" id="type" th:field="*{type}" required>
                                    <option value="INCOME">Доход</option>
                                    <option value="EXPENSE">Расход</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Описание</label>
                            <input type="text" class="form-control" id="description" th:field="*{description}"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="date" class="form-label">Дата</label>
                            <input type="datetime-local" class="form-control" id="date" th:field="*{date}" required/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-primary px-4">Сохранить</button>
                            <a th:href="@{/dashboard}" class="btn btn-outline-secondary">Отмена</a>
                        </div>
                    </form>

                    <div class="mt-5" th:if="${transactions != null and !transactions.isEmpty()}">
                        <h4 class="mb-3">История транзакций</h4>
                        <div class="table-responsive">
                            <table class="table table-striped table-bordered align-middle text-center">
                                <thead class="table-light">
                                <tr>
                                    <th>Дата</th>
                                    <th>Тип</th>
                                    <th>Сумма</th>
                                    <th>Описание</th>
                                    <th>Действия</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="transaction : ${transactions}">
                                    <td th:text="${#temporals.format(transaction.date, 'yyyy-MM-dd HH:mm')}"></td>
                                    <td th:text="${transaction.type == 'INCOME' ? 'Доход' : 'Расход'}"></td>
                                    <td th:text="${transaction.amount}"></td>
                                    <td th:text="${transaction.description} ?: 'Нет описания'"></td>
                                    <td>
                                        <a th:href="@{/transactions/edit/{id}(id=${transaction.id})}" class="btn btn-sm btn-info me-1">Редактировать️</a>
                                        <form th:action="@{/transactions/delete/{id}(id=${transaction.id})}" method="post" style="display:inline;">
                                            <button type="submit" class="btn btn-sm btn-danger">Удалить️</button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

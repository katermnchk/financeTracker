<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Finance Tracker - Transaction</title>
    <link href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg rounded-4">
                <div class="card-header bg-primary text-white text-center rounded-top-4">
                    <h3 th:text="${transaction.id != null} ? 'Редактировать транзакцию' : 'Новая транзакция'"></h3>
                </div>
                <div class="card-body">

                    <!-- Форма редактирования -->
                    <form th:if="${transaction.id != null}"
                          th:action="@{/transactions/edit/{id}(id=${transaction.id})}"
                          th:object="${transaction}" method="post">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Счёт</label>
                                <select class="form-select" th:field="*{accountId}" required>
                                    <option value="">Выберите счёт</option>
                                    <option th:each="account : ${accounts}"
                                            th:value="${account.id}"
                                            th:text="${account.name}"></option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{accountId}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Категория</label>
                                <select class="form-select" th:field="*{categoryId}" required>
                                    <option value="">Выберите категорию</option>
                                    <option th:each="category : ${availableCategories}"
                                            th:value="${category.id}"
                                            th:text="${category.name}"></option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{categoryId}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Сумма</label>
                                <input type="number" step="0.01" class="form-control" th:field="*{amount}" required/>
                                <div class="invalid-feedback" th:errors="*{amount}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Тип</label>
                                <select class="form-select" th:field="*{type}" required>
                                    <option value="INCOME">Доход</option>
                                    <option value="EXPENSE">Расход</option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{type}"></div>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Описание</label>
                                <input type="text" class="form-control" th:field="*{description}"/>
                                <div class="invalid-feedback" th:errors="*{description}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Дата</label>
                                <input type="datetime-local" class="form-control" th:field="*{date}" required/>
                                <div class="invalid-feedback" th:errors="*{date}"></div>
                            </div>

                            <div class="col-12 text-end">
                                <button type="submit" class="btn btn-success">Сохранить</button>
                                <a th:href="@{/dashboard}" class="btn btn-secondary">Отмена</a>
                            </div>
                        </div>
                    </form>

                    <!-- Форма создания -->
                    <form th:if="${transaction.id == null}"
                          th:action="@{/transactions/add}"
                          th:object="${transaction}" method="post">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Счёт</label>
                                <select class="form-select" th:field="*{accountId}" required>
                                    <option value="">Выберите счёт</option>
                                    <option th:each="account : ${accounts}"
                                            th:value="${account.id}"
                                            th:text="${account.name}"></option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{accountId}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Категория</label>
                                <select class="form-select" th:field="*{categoryId}" required>
                                    <option value="">Выберите категорию</option>
                                    <option th:each="category : ${availableCategories}"
                                            th:value="${category.id}"
                                            th:text="${category.name}"></option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{categoryId}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Сумма</label>
                                <input type="number" step="0.01" class="form-control" th:field="*{amount}" required/>
                                <div class="invalid-feedback" th:errors="*{amount}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Тип</label>
                                <select class="form-select" th:field="*{type}" required>
                                    <option value="INCOME">Доход</option>
                                    <option value="EXPENSE">Расход</option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{type}"></div>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Описание</label>
                                <input type="text" class="form-control" th:field="*{description}"/>
                                <div class="invalid-feedback" th:errors="*{description}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Дата</label>
                                <input type="datetime-local" class="form-control" th:field="*{date}" required/>
                                <div class="invalid-feedback" th:errors="*{date}"></div>
                            </div>

                            <div class="col-12 text-end">
                                <button type="submit" class="btn btn-success">Добавить</button>
                                <a th:href="@{/dashboard}" class="btn btn-secondary">Отмена</a>
                            </div>
                        </div>
                    </form>

                    <!-- История транзакций -->
                    <div class="mt-5" th:if="${transactions != null and !transactions.isEmpty()}">
                        <h4 class="mb-3">История транзакций</h4>
                        <table class="table table-bordered table-striped table-hover">
                            <thead class="table-light">
                            <tr>
                                <th>Дата</th>
                                <th>Тип</th>
                                <th>Сумма</th>
                                <th>Описание</th>
                                <th class="text-center">Действия</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="transaction : ${transactions}">
                                <td th:text="${#temporals.format(transaction.date, 'yyyy-MM-dd HH:mm')}"></td>
                                <td th:text="${transaction.type == 'INCOME' ? 'Доход' : 'Расход'}"></td>
                                <td th:text="${transaction.amount}"></td>
                                <td th:text="${transaction.description} ?: 'Нет описания'"></td>
                                <td class="text-center">
                                    <a th:href="@{/transactions/edit/{id}(id=${transaction.id})}" class="btn btn-info btn-sm me-2">Редактировать</a>
                                    <form th:action="@{/transactions/delete/{id}(id=${transaction.id})}" method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-danger btn-sm">Удалить</button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div> <!-- card-body -->
            </div> <!-- card -->
        </div> <!-- col -->
    </div> <!-- row -->
</div> <!-- container -->
</body>
</html>

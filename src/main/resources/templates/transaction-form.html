<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Finance Tracker - Transaction</title>
    <link href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3 th:text="${transaction != null and transaction.id != null} ? 'Edit Transaction' : 'New Transaction'"></h3>
                </div>
                <div class="card-body">
                    <form th:action="${transaction != null and transaction.id != null} ? @{/transactions/edit/{id}(id=${transaction.id})} : @{/transactions/{accountId}(accountId=${account != null ? account.id : ''})}"
                          th:object="${transaction != null ? transaction : newTransaction}" method="post">
                        <div class="mb-3">
                            <label for="accountId" class="form-label">Account</label>
                            <select class="form-control" id="accountId" th:field="*{accountId}" required>
                                <option value="">Select Account</option>
                                <option th:each="account : ${accounts}"
                                        th:value="${account.id}"
                                        th:text="${account.name}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('accountId')}" th:errors="*{accountId}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="categoryId" class="form-label">Category</label>
                            <select class="form-control" id="categoryId" th:field="*{categoryId}" required>
                                <option value="">Select Category</option>
                                <option th:each="category : ${categories}"
                                        th:value="${category.id}"
                                        th:text="${category.name}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="amount" class="form-label">Amount</label>
                            <input type="number" step="0.01" class="form-control" id="amount" th:field="*{amount}" required/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="type" class="form-label">Type</label>
                            <select class="form-control" id="type" th:field="*{type}" required>
                                <option value="INCOME">Income</option>
                                <option value="EXPENSE">Expense</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <input type="text" class="form-control" id="description" th:field="*{description}"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="date" class="form-label">Date</label>
                            <input type="datetime-local" class="form-control" id="date" th:field="*{date}" required/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Transaction</button>
                        <a th:href="@{/dashboard}" class="btn btn-secondary ms-2">Cancel</a>
                    </form>

                    <h4 class="mt-4" th:if="${transactions != null}">Transaction History</h4>
                    <table class="table table-bordered" th:if="${transactions != null}">
                        <thead>
                        <tr>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Amount</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="transaction : ${transactions}">
                            <td th:text="${#temporals.format(transaction.date, 'yyyy-MM-dd HH:mm')}"></td>
                            <td th:text="${transaction.type}"></td>
                            <td th:text="${transaction.amount}"></td>
                            <td th:text="${transaction.description} ?: 'N/A'"></td>
                            <td>
                                <a th:href="@{/transactions/edit/{id}(id=${transaction.id})}" class="btn btn-info btn-sm">Edit</a>
                                <form th:action="@{/transactions/delete/{id}(id=${transaction.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${transactions != null and transactions.empty}">
                            <td colspan="5">No transactions yet.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Finance Tracker - Транзакция</title>
    <link href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
<div class="container py-5">
    <h2 class="text-primary mb-4" th:text="${transaction.id != null} ? 'Редактировать транзакцию' : 'Добавить транзакцию'"></h2>

    <div class="mb-4">
        <a th:href="@{/dashboard}" class="btn btn-outline-primary">
            <i class="bi bi-house"></i> На главную
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
            <i class="bi bi-plus-circle"></i> <span th:text="${transaction.id != null} ? 'Редактирование транзакции' : 'Новая транзакция'"></span>
        </div>
        <div class="card-body">
            <form th:action="${transaction.id != null} ? @{/transactions/edit/{id}(id=${transaction.id})} : @{/transactions/add}"
                  th:object="${transaction}" method="post" id="transactionForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label for="accountId" class="form-label">Счёт</label>
                    <select class="form-control" id="accountId" th:field="*{accountId}" required>
                        <option value="" disabled selected>Выберите счёт</option>
                        <option th:each="account : ${accounts}"
                                th:value="${account.id}"
                                th:text="${account.name} + ' (' + ${account.balance} + ' BYN)'"
                                th:data-balance="${account.balance}"></option>
                    </select>
                    <div class="invalid-feedback">Пожалуйста, выберите счёт</div>
                </div>

                <div class="mb-3">
                    <label for="categoryId" class="form-label">Категория</label>
                    <select class="form-control" id="categoryId" th:field="*{categoryId}" required>
                        <option value="" disabled selected>Выберите категорию</option>
                        <option th:each="category : ${availableCategories}"
                                th:value="${category.id}"
                                th:text="${category.name}"></option>
                    </select>
                    <div class="invalid-feedback">Пожалуйста, выберите категорию</div>
                </div>

                <div class="mb-3">
                    <label for="amount" class="form-label">Сумма (BYN)</label>
                    <input type="number" class="form-control" id="amount" th:field="*{amount}"
                           step="0.01" min="0.01" required/>
                    <div class="invalid-feedback" id="amountError"></div>
                </div>

                <div class="mb-3">
                    <label for="type" class="form-label">Тип</label>
                    <select class="form-control" id="type" th:field="*{type}" required>
                        <option value="" disabled selected>Выберите тип</option>
                        <option value="INCOME">Доход</option>
                        <option value="EXPENSE">Расход</option>
                    </select>
                    <div class="invalid-feedback">Пожалуйста, выберите тип транзакции</div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Описание</label>
                    <input type="text" class="form-control" id="description" th:field="*{description}"/>
                </div>

                <div class="mb-3">
                    <label for="date" class="form-label">Дата</label>
                    <input type="datetime-local" class="form-control" id="date" th:field="*{date}"/>
                </div>

                <div th:if="${error != null}" class="alert alert-danger">
                    <span th:text="${error}"></span>
                </div>

                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-circle"></i> Сохранить
                </button>
            </form>
        </div>
    </div>
</div>

<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('transactionForm').addEventListener('submit', function(event) {
        const amountInput = document.getElementById('amount');
        const typeSelect = document.getElementById('type');
        const accountSelect = document.getElementById('accountId');
        const amountError = document.getElementById('amountError');
        const amount = parseFloat(amountInput.value);
        const type = typeSelect.value;
        const selectedAccount = accountSelect.options[accountSelect.selectedIndex];
        const balance = parseFloat(selectedAccount.getAttribute('data-balance'));
        amountInput.classList.remove('is-invalid');
        amountError.textContent = '';

        if (amount <= 0) {
            event.preventDefault();
            amountInput.classList.add('is-invalid');
            amountError.textContent = 'Сумма должна быть больше 0';
            return;
        }

        if (type === 'EXPENSE' && amount > balance) {
            event.preventDefault();
            amountInput.classList.add('is-invalid');
            amountError.textContent = `Недостаточно средств. Текущий баланс: ${balance} BYN`;
        }
    });

    document.getElementById('type').addEventListener('change', function() {
        document.getElementById('amount').dispatchEvent(new Event('input'));
    });
    document.getElementById('accountId').addEventListener('change', function() {
        document.getElementById('amount').dispatchEvent(new Event('input'));
    });

    (function () {
        'use strict';
        const form = document.getElementById('transactionForm');
        form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        }, false);
    })();
</script>
</body>
</html>

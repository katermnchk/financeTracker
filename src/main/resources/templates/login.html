<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Вход</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<h2>Вход</h2>
<form th:action="@{/login}" method="post">
    <div th:if="${param.error}" style="color: red;">Неверное имя пользователя или пароль</div>
    <div th:if="${param.logout}" style="color: green;">Вы успешно вышли</div>
    <div th:if="${param.success}" style="color: green;">Регистрация успешна, войдите</div>
    <div>
        <label for="username">Имя пользователя:</label>
        <input type="text" id="username" name="username">
    </div>
    <div>
        <label for="password">Пароль:</label>
        <input type="password" id="password" name="password">
    </div>
    <button type="submit">Войти</button>
</form>
<p>Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
</body>
</html>

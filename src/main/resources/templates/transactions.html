<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Finance Tracker - История транзакций</title>
    <link href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
<div class="container py-5">
    <h2 class="text-primary mb-4">История транзакций</h2>

    <div class="mb-4">
        <a th:href="@{/dashboard}" class="btn btn-outline-primary">
            <i class="bi bi-house"></i> На главную
        </a>
        <a th:href="@{/transactions/add/{id}(id=${account.id})}" class="btn btn-success ms-2">
            <i class="bi bi-plus-circle"></i> Добавить транзакцию
        </a>
    </div>

    <div th:if="${error != null}" class="alert alert-danger">
        <span th:text="${error}"></span>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-info text-white">
            <i class="bi bi-list-ul"></i> Транзакции для счёта: <span th:text="${account.name}"></span> (Баланс: <span th:text="${account.balance} + ' BYN'"></span>)
        </div>
        <div class="card-body">
            <table class="table table-hover table-bordered align-middle">
                <thead class="table-light">
                <tr>
                    <th>Дата</th>
                    <th>Тип</th>
                    <th>Категория</th>
                    <th>Сумма</th>
                    <th>Описание</th>
                    <th class="text-center">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="transaction : ${transactions}">
                    <td th:text="${#temporals.format(transaction.date, 'dd.MM.yyyy HH:mm')}"></td>
                    <td th:text="${transaction.type == 'INCOME' ? 'Доход' : 'Расход'}"></td>
                    <td th:text="${transaction.category != null} ? ${transaction.category.name} : 'Без категории'"></td>
                    <td th:text="${transaction.amount} + ' BYN'"></td>
                    <td th:text="${transaction.description} ?: '-'"></td>
                    <td class="text-center">
                        <a th:href="@{/transactions/edit/{id}(id=${transaction.id})}" class="btn btn-sm btn-primary me-2">
                            <i class="bi bi-pencil"></i> Редактировать
                        </a>
                        <form th:action="@{/transactions/delete/{id}(id=${transaction.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Вы уверены, что хотите удалить эту транзакцию?')">
                                <i class="bi bi-trash"></i> Удалить
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${transactions.isEmpty()}">
                    <td colspan="6" class="text-center text-muted">Транзакций пока нет</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
